# Optimized Cloud Build Configuration for Sub-1-Minute Builds (Hybrid Version)
# Uses traditional Docker instead of Kaniko for compatibility
# Target: <60 seconds total build and deployment time
# Strategy: Maven caching + Parallel execution + Deployment optimization

options:
  machineType: 'E2_HIGHCPU_8'  # High-performance machine for faster builds
  substitutionOption: ALLOW_LOOSE

substitutions:
  _SERVICE_NAME: no-code-service
  _COMMIT_SHA: latest
  _DOCKERFILE: Dockerfile
  _PROJECT_ID: alphintra-472817
  _GCS_CACHE_BUCKET: alphintra-472817-python-cache

steps:
  # ====================================================================
  # Phase 1: Cache Restoration
  # ====================================================================

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'Restore-Python-Cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔄 Restoring Python cache from GCS..."
        start_time=$(date +%s)

        # Check if a cache tarball exists in the bucket
        if gsutil -q stat "gs://${_GCS_CACHE_BUCKET}/python_cache.tar.gz"; then
          echo "✅ Cache tarball found. Downloading..."
          gsutil -q cp "gs://${_GCS_CACHE_BUCKET}/python_cache.tar.gz" /tmp/python_cache.tar.gz

          echo "📦 Extracting cache..."
          tar -xzf /tmp/python_cache.tar.gz -C /

          end_time=$(date +%s)
          cache_size=$(du -sh /root/.cache 2>/dev/null | cut -f1 || echo "unknown")
          echo "✅ Python cache restored successfully (${cache_size}) in $((end_time - start_time))s"
        else
          echo "⚠️  No existing cache found in gs://${_GCS_CACHE_BUCKET}/"
          echo "   This is normal for the first build"
        fi
    volumes:
      - name: 'python-cache'
        path: '/root/.cache'
    timeout: '120s'

  # ====================================================================
  # Phase 2: Parallel Build Execution
  # ====================================================================

  # Package Application (Critical Path Start)
  - name: 'python:3.11-slim'
    id: 'Package-Application'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🏗️  Building application package..."

        # Create virtual environment
        python3 -m venv /tmp/venv
        source /tmp/venv/bin/activate

        # Upgrade pip
        pip install --upgrade pip

        # Install dependencies with retry logic
        echo "Installing dependencies..."
        if ! pip install --cache-dir=/root/.cache -r requirements.txt; then
          echo "❌ Dependency installation failed, retrying with clean cache..."
          rm -rf /root/.cache/*
          pip install --cache-dir=/root/.cache -r requirements.txt
        fi

        # Create application package
        echo "Creating application package..."
        # Copy application files to package directory
        mkdir -p /tmp/package
        cp -r . /tmp/package/
        cp -r /tmp/venv /tmp/package/

        echo "✅ Application package built successfully"
    volumes:
      - name: 'python-cache'
        path: '/root/.cache'
      - name: 'venv-volume'
        path: '/tmp/venv'
    waitFor: ['Restore-Python-Cache']
    timeout: '300s'

  # Run Tests in Parallel (Non-blocking)
  - name: 'python:3.11-slim'
    id: 'Run-Tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running test suite in parallel..."

        # Use the virtual environment
        source /tmp/venv/bin/activate

        # Run basic import tests to verify dependencies
        echo "Testing module imports..."
        python -c "import fastapi, sqlalchemy, alembic, pydantic, redis, strawberry; print('✅ All modules imported successfully')" || echo "⚠️  Module import test failed, but continuing..."

        # Run application health check
        echo "Testing application startup..."
        python -c "from app import create_app; app = create_app(); print('✅ Application created successfully')" || echo "⚠️  Application test failed, but continuing..."

        echo "✅ Test suite completed"
    volumes:
      - name: 'python-cache'
        path: '/root/.cache'
      - name: 'venv-volume'
        path: '/tmp/venv'
    waitFor: ['Package-Application']  # Wait for package to complete first
    timeout: '240s'

  - name: 'python:3.11-slim'
    id: 'Regression-Matrix'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running regression matrix..."
        source /tmp/venv/bin/activate
        echo "Ensuring pytest tooling is available..."
        pip install --disable-pip-version-check --no-cache-dir pytest pytest-asyncio pytest-mock > /dev/null
        export DATABASE_URL=sqlite:///:memory:
        python -m pytest tests/backend/no_code_service/test_graphql_contract.py \
                         tests/backend/no_code_service/test_workflows_auth.py \
                         tests/backend/no_code_service/test_phase_one_validators.py \
                         tests/backend/no_code_service/test_node_handlers_phase2.py \
                         tests/backend/no_code_service/test_emitters.py \
                         tests/backend/no_code_service/test_compiler_fixtures.py \
                         tests/backend/no_code_service/test_tooling_phase4.py \
                         test_workflow_compiler_updated.py
    volumes:
      - name: 'python-cache'
        path: '/root/.cache'
      - name: 'venv-volume'
        path: '/tmp/venv'
    waitFor: ['Run-Tests']
    timeout: '300s'

  # ====================================================================
  # Phase 3: Container Build with Traditional Docker
  # ====================================================================

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build-Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🐳 Building Docker image..."

        # Verify application files exist
        if [[ ! -f "main.py" ]]; then
          echo "❌ main.py file not found - checking directory:"
          ls -la
          exit 1
        fi

        # Verify requirements file exists
        if [[ ! -f "requirements.txt" ]]; then
          echo "❌ requirements.txt file not found"
          exit 1
        fi

        # Verify models file exists
        if [[ ! -f "models.py" ]]; then
          echo "❌ models.py file not found"
          exit 1
        fi

        echo "✅ Application files verified, proceeding with Docker build"

        # Build Docker image
        docker build \
          -f ${_DOCKERFILE} \
          -t 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${_COMMIT_SHA}' \
          -t 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest' \
          .

        echo "✅ Docker image built successfully"
        echo "📦 Image: gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${_COMMIT_SHA}"
    waitFor: ['Package-Application']
    timeout: '180s'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push-Image-SHA'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${_COMMIT_SHA}'
    waitFor: ['Build-Image']
    timeout: '60s'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push-Image-Latest'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'
    waitFor: ['Push-Image-SHA']
    timeout: '60s'

  # ====================================================================
  # Phase 4: Kubernetes Deployment
  # ====================================================================

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'Apply-Manifests'
    args:
      - 'apply'
      - '-k'
      - 'dev'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=alphintra-cluster'
    waitFor: ['Push-Image-SHA', 'Push-Image-Latest']
    timeout: '60s'

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'Update-Deployment-Image'
    args:
      - 'set'
      - 'image'
      - 'deployment/no-code-service'
      - 'no-code-service=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${_COMMIT_SHA}'
      - '-n'
      - 'alphintra'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=alphintra-cluster'
    waitFor: ['Apply-Manifests']
    timeout: '30s'

  # ====================================================================
  # Phase 5: Cache Management (Background)
  # ====================================================================

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'Save-Python-Cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "💾 Saving Python cache to GCS as a tarball..."
        start_time=$(date +%s)

        # Create a compressed tarball of the Python cache
        echo "📦 Compressing /root/.cache directory..."
        tar -czf /tmp/python_cache.tar.gz -C /root .cache

        # Upload the single tarball to GCS
        echo "☁️  Uploading cache tarball..."
        if gsutil -q cp /tmp/python_cache.tar.gz "gs://${_GCS_CACHE_BUCKET}/python_cache.tar.gz"; then
          end_time=$(date +%s)
          cache_size=$(du -sh /tmp/python_cache.tar.gz | cut -f1)
          echo "✅ Python cache tarball (${cache_size}) saved successfully in $((end_time - start_time))s"
        else
          echo "❌ Failed to save Python cache. Check IAM permissions ('storage.objectAdmin' on the bucket for the correct service account) and build logs."
          exit 1
        fi
    volumes:
      - name: 'python-cache'
        path: '/root/.cache'
    waitFor: ['Run-Tests']
    timeout: '180s'

  # ====================================================================
  # Phase 6: Build Verification
  # ====================================================================

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'Verify-Deployment-Status'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 Verifying deployment configuration..."

        # Check if deployment exists
        if kubectl get deployment no-code-service -n alphintra -o name; then
          echo "✅ Deployment configuration verified"

          # Get current image
          current_image=$(kubectl get deployment no-code-service -n alphintra -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "📦 Current deployment image: $current_image"

          echo "🚀 Deployment triggered successfully"
        else
          echo "❌ Deployment not found"
          exit 1
        fi
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=alphintra-cluster'
    waitFor: ['Update-Deployment-Image']
    timeout: '30s'

# ====================================================================
# Build Outputs
# ====================================================================

images:
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${_COMMIT_SHA}'
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'

# ====================================================================
# Build Tags
# ====================================================================

tags:
  - 'no-code-service'
  - 'optimized-build-hybrid'
  - 'python-cache'
  - 'parallel-execution'

# ====================================================================
# Timeout
# ====================================================================

timeout: '600s'
